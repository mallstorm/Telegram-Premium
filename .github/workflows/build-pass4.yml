name: Build Pass 4 APK

on:
  push:
    branches: [ pass4-build ]
    paths:
      - "scripts/**"
      - ".github/workflows/build-pass4.yml"
      - ".gitmodules"
      - "upstream/Telegram"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout with Telegram source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free runner disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf "$ANDROID_HOME"/ndk/* || true
          sudo rm -rf "$ANDROID_HOME"/cmake/* || true
          sudo apt-get clean
          df -h

      - name: Install Android build components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"

      - name: Apply TelePremium patches
        run: python3 scripts/apply_telepremium_patches.py

      - name: Verify source invariants
        run: python3 scripts/verify_source.py

      - name: Build release APK
        working-directory: upstream/Telegram
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find upstream/Telegram/TMessagesProj_App -type f -name app.apk | grep -E '/(afat|release)/' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found"
            find upstream/Telegram/TMessagesProj_App -type f -name '*.apk' -print
            exit 1
          fi
          cp "$APK" TelePremium_11.4.2_Pass4_10accounts_arm64_ci.apk
          ls -lh TelePremium_11.4.2_Pass4_10accounts_ci.apk
          sha256sum TelePremium_11.4.2_Pass4_10accounts_ci.apk | tee TelePremium_11.4.2_Pass4_10accounts_arm64_ci.sha256

      - name: Upload Pass 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: TelePremium-Pass4-10accounts-arm64
          path: |
            TelePremium_11.4.2_Pass4_10accounts_ci.apk
            TelePremium_11.4.2_Pass4_10accounts_ci.sha256
          if-no-files-found: error
          retention-days: 30
