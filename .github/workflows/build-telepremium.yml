name: Build TelePremium APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply TelePremium patches
        run: |
          python3 scripts/apply_telepremium_patches.py
          python3 scripts/verify_source.py
      - name: Build APK
        working-directory: upstream/Telegram
        run: |
          chmod +x gradlew
          ./gradlew TMessagesProj_App:assembleDebug --stacktrace
      - name: Collect APK
        if: always()
        run: |
          mkdir -p artifacts
          find upstream/Telegram -type f -name '*.apk' -exec cp {} artifacts/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelePremium-Cloud-APK
          path: artifacts/*.apk
          if-no-files-found: warn
