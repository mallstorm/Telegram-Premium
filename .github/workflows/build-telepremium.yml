name: Build TelePremium APK

on:
  push:
    branches: [ port/tg-13.1.1, feature/classic-telegram-11x, feature/telegram-ai-analyzer, claude/dual-shell-stabilize ]
    tags: [ 'v*' ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
  pull_request:
    branches: [ main, port/tg-13.1.1, feature/classic-telegram-11x ]

concurrency:
  group: build-telepremium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      APK_NAME: TelePremium_13.1.1_arm64-v8a.apk
      OUTPUT_BRANCH: ${{ github.event_name == 'pull_request' && format('build-output-tg13-pr-{0}', github.event.pull_request.number) || (github.ref_name == 'claude/dual-shell-stabilize' && 'build-output-dualshell' || 'build-output-tg13') }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
      CCACHE_NOHASHDIR: "true"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Free runner disk for Telegram native build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /usr/share/swift || true
          if [ -n "${ANDROID_HOME:-}" ]; then
            sudo rm -rf "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
            if [ -d "$ANDROID_HOME/ndk" ]; then
              find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d ! -name '27.2.12479018' -exec sudo rm -rf {} \;
            fi
          fi
          df -h "$GITHUB_WORKSPACE"

      - name: Add swap (R8 needs more than the runner's 7 GB RAM)
        run: |
          SWAP=/mnt/tp-swapfile
          sudo fallocate -l 12G "$SWAP" 2>/dev/null || { SWAP=/tp-swapfile; sudo fallocate -l 8G "$SWAP"; }
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP" >/dev/null
          sudo swapon "$SWAP" || echo "::warning::swap could not be enabled"
          free -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            upstream/Telegram/**/*.gradle
            upstream/Telegram/gradle/wrapper/gradle-wrapper.properties
            patches/tg13/manifest.json

      - name: Install Android SDK 36, NDK 27.2 and CMake 3.22.1
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq ccache >/dev/null
          ccache --version | head -n 1

      - name: Restore native compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-tg13-${{ hashFiles('patches/tg13/manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-tg13-${{ hashFiles('patches/tg13/manifest.json') }}-
            ccache-tg13-

      - name: Apply and verify TelePremium overlay
        id: patches
        run: |
          set -euo pipefail
          test "$(git -C upstream/Telegram rev-parse HEAD)" = "$(python3 -c "import json;print(json.load(open('patches/tg13/manifest.json'))['upstream_revision'])")"
          python3 scripts/apply_overlay.py patches/tg13
          python3 scripts/verify_tg13.py
          python3 scripts/verify_classic_shell.py
          python3 scripts/verify_ai_analyzer.py
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/messenger/telepremium
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumAnalyzerActivity.java
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumClassicDrawer.java
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumClassicSettingsActivity.java
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumInterfaceModeActivity.java

      - name: Pure-Java tests
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tp-tests"; mkdir -p "$OUT"
          javac -d "$OUT" $(python3 scripts/tests/sources.py) scripts/tests/*.java
          for t in $(cd scripts/tests && ls *Test.java | sed 's/\.java$//'); do java -cp "$OUT" "$t"; done

      - name: Vault default encryption and sync regression tests
        run: |
          python3 scripts/test_vault_keys.py
          python3 scripts/test_vault_runtime.py
          python3 scripts/test_vault_peers.py
          python3 scripts/test_cloud_reset.py
          python3 scripts/test_cloud_image_display_and_names.py
          python3 scripts/test_cloud_photo_thumbnail_runtime.py
          python3 scripts/test_cloud_preview_runtime.py
          python3 scripts/test_media_vault_runtime.py
          python3 scripts/test_media_playback_runtime.py
          python3 scripts/test_account_xray_runtime.py
          python3 scripts/test_xray_config_and_sync_model.py
          python3 scripts/test_media_settings_sync_runtime.py
          python3 scripts/verify_xray_payload.py

      - name: Inject Telegram API credentials
        id: api
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "${TELEGRAM_API_ID}" ] && [ -z "${TELEGRAM_API_HASH}" ]; then
            echo "::warning::TELEGRAM_API_ID / TELEGRAM_API_HASH secrets are not set: validation build only"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/configure_telegram_api.py
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Private signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::notice::RELEASE_KEYSTORE_BASE64 is not set: signing with the upstream release.keystore (update-compatible with earlier builds)"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > upstream/Telegram/TMessagesProj/config/release.keystore
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("upstream/Telegram/gradle.properties")
          lines = [l for l in p.read_text().splitlines() if not l.startswith(("RELEASE_KEY_PASSWORD=", "RELEASE_KEY_ALIAS=", "RELEASE_STORE_PASSWORD="))]
          lines += [f"RELEASE_KEY_PASSWORD={os.environ['KEY_PASSWORD']}", f"RELEASE_KEY_ALIAS={os.environ['KEY_ALIAS']}",
                    f"RELEASE_STORE_PASSWORD={os.environ['KEYSTORE_PASSWORD']}"]
          p.write_text("\n".join(lines) + "\n")
          PY
          echo "::notice::Signing with the private release key from repository secrets"

      - name: Prepare Gradle build
        working-directory: upstream/Telegram
        run: |
          chmod +x gradlew
          python3 - <<'PYCONFIG'
          import copy, json
          from pathlib import Path
          path = Path("TMessagesProj_App/google-services.json")
          config = json.loads(path.read_text())
          clients = config.get("client", [])
          packages = {c["client_info"]["android_client_info"]["package_name"] for c in clients}
          for package in ("com.telepremium.messenger", "com.telepremium.messenger.beta"):
              if package not in packages:
                  client = copy.deepcopy(clients[0])
                  client["client_info"]["android_client_info"]["package_name"] = package
                  clients.append(client)
          path.write_text(json.dumps(config))
          PYCONFIG
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "APK_NAME=TelePremium_${GITHUB_REF_NAME}_arm64-v8a.apk" >> "$GITHUB_ENV"
          fi
          # Upstream asks for -Xmx8g; the hosted runner has 7 GB RAM. Keep the Gradle daemon smaller
          # (R8 runs inside it) and let swap absorb peaks.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          ccache -z >/dev/null

      - name: Compile resources and Java before native build
        id: java
        working-directory: upstream/Telegram
        run: |
          set +e
          timeout --signal=TERM --kill-after=1m 50m ./gradlew :TMessagesProj_App:processAfatReleaseResources :TMessagesProj:compileReleaseJavaWithJavac --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/gradle-java.log"
          compile_status=${PIPESTATUS[0]}
          set -e
          exit "$compile_status"

      - name: Build arm64-v8a APK
        id: apk
        working-directory: upstream/Telegram
        run: |
          set +e
          timeout --signal=TERM --kill-after=2m 170m ./gradlew TMessagesProj_App:assembleAfatRelease --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/gradle-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          ccache -s | tee "$GITHUB_WORKSPACE/diagnostics/ccache.txt"
          exit "$build_status"

      - name: Save native compiler cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-tg13-${{ hashFiles('patches/tg13/manifest.json') }}-${{ github.sha }}

      - name: Verify APK (arm64-v8a only, signature, package)
        id: verify
        run: |
          set -euo pipefail
          APK="$(find upstream/Telegram/TMessagesProj_App/build/outputs/apk -type f -name '*.apk' | grep -i afat | grep -i release | head -n 1)"
          test -n "$APK"
          mkdir -p artifacts
          cp "$APK" "artifacts/$APK_NAME"
          ABIS="$(unzip -Z1 "artifacts/$APK_NAME" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          echo "ABIs in APK: $ABIS"
          if [ "$ABIS" != "arm64-v8a" ]; then echo "::error::APK must contain only arm64-v8a native libraries, got: $ABIS"; exit 1; fi
          aapt2 dump badging "artifacts/$APK_NAME" | head -n 3 | tee diagnostics/apk-badging.txt
          apksigner verify --print-certs "artifacts/$APK_NAME" | tee diagnostics/apk-signature.txt
          # Prevent accidental key rotation: an APK with a different signer cannot update
          # the installed com.telepremium.messenger without losing app data.
          EXPECTED_CERT_SHA256="a08d7dc323ddf71ef3201944397e0d3cce7d40847263e11f328b68bbe19229ab"
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' diagnostics/apk-signature.txt | head -n 1 | tr -d '\r')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release signing certificate differs from the installed TelePremium builds"
            exit 1
          fi
          sha256sum "artifacts/$APK_NAME" | tee "artifacts/$APK_NAME.sha256"
          if [ "${{ steps.api.outputs.configured }}" != "true" ]; then
            ls -lh artifacts > diagnostics/validation-build.txt
            rm -rf artifacts
            echo "::error::Validation build succeeded, but the APK has no Telegram API credentials. Add TELEGRAM_API_ID and TELEGRAM_API_HASH secrets."
            exit 1
          fi

      - name: Publish GitHub release for tag
        if: success() && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/make_update_manifest.py "artifacts/$APK_NAME" "$GITHUB_REF_NAME" > artifacts/telepremium-update.json
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "TelePremium $GITHUB_REF_NAME" \
            --notes "TelePremium on Telegram Android 13.1.1, arm64-v8a. SHA-256: $(cut -d' ' -f1 "artifacts/$APK_NAME.sha256")"

      - name: Save build diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          df -h > diagnostics/disk.txt
          git rev-parse HEAD > diagnostics/commit.txt
          git submodule status > diagnostics/submodules.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelePremium-Build-Diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TelePremium-arm64-v8a-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build-output branch
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PATCHES: ${{ steps.patches.outcome }}
          JAVA: ${{ steps.java.outcome }}
          APK: ${{ steps.apk.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          API: ${{ steps.api.outputs.configured }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/build-output"
          rm -rf "$OUT"; mkdir -p "$OUT"
          printf 'status=%s\nsource_ref=%s\nsource_sha=%s\nrun_id=%s\npatches=%s\njava=%s\napk=%s\nverify=%s\napi_configured=%s\n' \
            "$JOB_STATUS" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PATCHES" "$JAVA" "$APK" "$VERIFY" "$API" > "$OUT/STATUS.txt"
          for f in gradle-java.log gradle-build.log; do
            [ -f "diagnostics/$f" ] && { grep -nE 'error:|e: |FAILURE|What went wrong|BUILD (SUCCESSFUL|FAILED)|CMake Error|ninja: build stopped' "diagnostics/$f" | head -n 400 > "$OUT/${f%.log}.errors.txt" || true; tail -n 300 "diagnostics/$f" > "$OUT/${f%.log}.tail.txt"; }
          done
          cp diagnostics/apk-*.txt diagnostics/validation-build.txt diagnostics/ccache.txt "$OUT/" 2>/dev/null || true
          if [ -f "artifacts/$APK_NAME" ]; then
            split -b 45m -d -a 2 "artifacts/$APK_NAME" "$OUT/$APK_NAME.part"
            cp "artifacts/$APK_NAME.sha256" "$OUT/"
          fi
          cd "$OUT"
          git init -q
          git checkout -q -b "$OUTPUT_BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Build output: ${JOB_STATUS} ${GITHUB_REF_NAME}@${GITHUB_SHA::7} run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$OUTPUT_BRANCH"
