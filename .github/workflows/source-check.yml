name: Source Check

on:
  push:
    branches: [ port/tg-13.1.1 ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply and verify TelePremium overlay
        run: |
          python3 scripts/apply_overlay.py patches/tg13
          python3 scripts/verify_tg13.py
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/messenger/telepremium
      - name: Pure-Java tests
        run: |
          OUT="$RUNNER_TEMP/tp-tests"; mkdir -p "$OUT"
          javac -d "$OUT" $(python3 scripts/tests/sources.py) scripts/tests/*.java
          for t in $(cd scripts/tests && ls *Test.java | sed 's/\.java$//'); do java -cp "$OUT" "$t"; done
      - name: Vault default encryption and sync regression tests
        run: |
          python3 scripts/test_vault_keys.py
          python3 scripts/test_vault_runtime.py
          python3 scripts/test_vault_peers.py
          python3 scripts/test_cloud_reset.py
      - name: Show pinned upstream revision
        run: git -C upstream/Telegram rev-parse HEAD
