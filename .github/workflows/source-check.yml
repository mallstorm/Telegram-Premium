name: Source Check

on:
  push:
    branches: [ port/tg-13.1.1, feature/classic-telegram-11x, feature/telegram-ai-analyzer, claude/dual-shell-stabilize, feat/folder-locks-dual ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply and verify TelePremium overlay
        run: |
          python3 scripts/apply_overlay.py patches/tg13
          python3 scripts/verify_tg13.py
          python3 scripts/verify_classic_shell.py
          python3 scripts/verify_ai_analyzer.py
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/messenger/telepremium
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumAnalyzerActivity.java
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumClassicDrawer.java
          java scripts/CheckJavaSyntax.java upstream/Telegram/TMessagesProj/src/main/java/org/telegram/ui/TelePremiumClassicSettingsActivity.java
      - name: Pure-Java tests
        run: |
          OUT="$RUNNER_TEMP/tp-tests"; mkdir -p "$OUT"
          javac -d "$OUT" $(python3 scripts/tests/sources.py) scripts/tests/*.java
          for t in $(cd scripts/tests && ls *Test.java | sed 's/\.java$//'); do java -cp "$OUT" "$t"; done
      - name: Vault default encryption and sync regression tests
        run: |
          python3 scripts/test_vault_keys.py
          python3 scripts/test_vault_runtime.py
          python3 scripts/test_vault_peers.py
          python3 scripts/test_cloud_reset.py
          python3 scripts/test_cloud_image_display_and_names.py
          python3 scripts/test_cloud_photo_thumbnail_runtime.py
          python3 scripts/test_cloud_preview_runtime.py
          python3 scripts/test_media_vault_runtime.py
          python3 scripts/test_media_playback_runtime.py
          python3 scripts/test_account_xray_runtime.py
          python3 scripts/test_xray_config_and_sync_model.py
          python3 scripts/test_media_settings_sync_runtime.py
          python3 scripts/verify_xray_payload.py
      - name: Exercise pinned Xray native routing on loopback
        run: python3 scripts/test_xray_native_routes.py --download
      - name: Show pinned upstream revision
        run: git -C upstream/Telegram rev-parse HEAD
