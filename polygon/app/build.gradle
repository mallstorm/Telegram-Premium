plugins {
    id 'com.android.application'
}

def apiId = System.getenv('POLYGON_API_ID') ?: '0'
def apiHash = System.getenv('POLYGON_API_HASH') ?: ''
def signingFile = System.getenv('POLYGON_SIGNING_FILE')
def signingPass = System.getenv('POLYGON_SIGNING_PASSWORD')
def signingAlias = System.getenv('POLYGON_SIGNING_ALIAS') ?: 'polygon_release'

android {
    namespace 'go.poligon.messenger'
    compileSdk 35

    defaultConfig {
        applicationId 'go.poligon.messenger'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'int', 'API_ID', apiId
        buildConfigField 'String', 'API_HASH', '"' + apiHash + '"'
    }
    if (signingFile && signingPass) {
        signingConfigs {
            polygon {
                storeFile file(signingFile)
                storePassword signingPass
                keyAlias signingAlias
                keyPassword signingPass
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            if (signingFile && signingPass) signingConfig signingConfigs.polygon
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'io.github.tdlib-android:core:0.1.1'
}
